<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CubeX Enterprises — Coming Soon</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 30% 20%, #16233f 0%, #0a0f1e 60%, #06080f 100%);
    color:#e8edf7; font-family:'Segoe UI', Arial, sans-serif; text-align:center; padding:24px;
    overflow:hidden;
  }

  /* ===== animated market background ===== */
  .bg { position:fixed; inset:0; z-index:0; overflow:hidden; }
  .grid {
    position:absolute; inset:-2px;
    background-image:
      linear-gradient(rgba(91,140,255,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,140,255,.10) 1px, transparent 1px);
    background-size:60px 60px;
    mask-image: radial-gradient(ellipse 90% 75% at 50% 45%, #000 30%, transparent 80%);
    animation: gridDrift 22s linear infinite;
  }
  @keyframes gridDrift { from{background-position:0 0} to{background-position:60px 60px} }

  /* candlestick rows at bottom */
  .candles { position:absolute; left:0; right:0; bottom:-8px; display:flex; align-items:flex-end; gap:9px; }
  .candles.back  { height:42vh; opacity:.20; filter:blur(1.5px); }
  .candles.front { height:26vh; opacity:.45; }
  .candle { flex:1; min-width:9px; position:relative; display:flex; justify-content:center; align-items:flex-end; }
  .candle i { display:block; width:100%; border-radius:2px; animation:candleGrow 5.5s ease-in-out infinite; }
  .candle::after { content:""; position:absolute; bottom:0; width:2px; height:calc(100% + 16px); background:currentColor; opacity:.35; }
  .candle.up { color:#1fd286; }
  .candle.dn { color:#ff4d5e; }
  .candle.up i { background:linear-gradient(180deg,#1fd286,rgba(31,210,134,.12)); }
  .candle.dn i { background:linear-gradient(180deg,#ff4d5e,rgba(255,77,94,.12)); }
  @keyframes candleGrow { 0%,100%{height:var(--h)} 50%{height:calc(var(--h)*var(--p))} }

  /* glowing price line that draws itself, then pulses */
  .priceline { position:absolute; inset:0; opacity:.7; }
  .priceline path {
    fill:none; stroke:url(#plg); stroke-width:2;
    stroke-dasharray:2600; stroke-dashoffset:2600;
    animation: draw 8s ease-out forwards, glowpulse 4s 8s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(31,210,134,.6));
  }
  @keyframes draw { to{stroke-dashoffset:0} }
  @keyframes glowpulse { 0%,100%{opacity:.95} 50%{opacity:.5} }

  /* floating currency pair chips */
  .chip {
    position:absolute; font-size:11px; letter-spacing:1.5px;
    padding:6px 11px; border:1px solid rgba(91,140,255,.22); border-radius:6px;
    background:rgba(8,17,32,.55); backdrop-filter:blur(4px);
    color:#7c8aa8; white-space:nowrap;
    animation: floaty var(--t) ease-in-out infinite;
  }
  .chip b { color:#e8edf7; }
  .chip.up b { color:#1fd286; }
  .chip.dn b { color:#ff4d5e; }
  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }

  /* ===== content ===== */
  .wrap { position:relative; z-index:2; max-width:720px; }
  .logo { font-size:14px; letter-spacing:6px; color:#5b8cff; text-transform:uppercase; margin-bottom:18px; }
  h1 { font-size:clamp(34px, 6vw, 64px); font-weight:700; margin-bottom:14px; }
  h1 span { color:#5b8cff; }
  p.sub { color:#9aa7c0; font-size:clamp(15px,2.5vw,19px); margin-bottom:48px; }
  .timer { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:48px; }
  .cell {
    background:rgba(8,15,29,.72); border:1px solid rgba(91,140,255,0.25);
    border-radius:14px; padding:22px 10px; min-width:108px; backdrop-filter:blur(6px);
  }
  .num { font-size:clamp(32px,5vw,52px); font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }
  .lbl { font-size:12px; letter-spacing:2px; color:#7c8aa8; text-transform:uppercase; margin-top:6px; }
  .foot { color:#5d6a85; font-size:13px; }
</style>
</head>
<body>

  <div class="bg">
    <div class="grid"></div>

    <svg class="priceline" viewBox="0 0 1440 800" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="plg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ff4d5e"/>
          <stop offset=".5" stop-color="#f3b73c"/>
          <stop offset="1" stop-color="#1fd286"/>
        </linearGradient>
      </defs>
      <path d="M-20,560 L90,540 L150,580 L230,470 L300,510 L380,420 L450,460 L540,350 L620,400 L700,300 L790,360 L870,250 L950,310 L1040,200 L1120,260 L1210,160 L1300,210 L1380,120 L1460,160"/>
    </svg>

    <div class="candles back" id="candlesBack"></div>
    <div class="candles front" id="candlesFront"></div>

    <div class="chip up" style="left:6%;  top:20%; --t:7s">EUR/USD <b>&#9650; 1.0842</b></div>
    <div class="chip dn" style="left:79%; top:15%; --t:9s">GBP/JPY <b>&#9660; 188.42</b></div>
    <div class="chip up" style="left:10%; top:62%; --t:8s">XAU/USD <b>&#9650; 2,381.5</b></div>
    <div class="chip dn" style="left:83%; top:56%; --t:6.5s">USD/CHF <b>&#9660; 0.8911</b></div>
    <div class="chip up" style="left:45%; top:8%;  --t:10s">BTC/USD <b>&#9650; 97,240</b></div>
  </div>

  <div class="wrap">
    <div class="logo">CubeX Enterprises</div>
    <h1>Something big is <span>coming</span></h1>
    <p class="sub">Our new trading platform is launching soon. Stay tuned.</p>
    <div class="timer">
      <div class="cell"><div class="num" id="d">--</div><div class="lbl">Days</div></div>
      <div class="cell"><div class="num" id="h">--</div><div class="lbl">Hours</div></div>
      <div class="cell"><div class="num" id="m">--</div><div class="lbl">Minutes</div></div>
      <div class="cell"><div class="num" id="s">--</div><div class="lbl">Seconds</div></div>
    </div>
    <div class="foot">&copy; 2026 CubeX Enterprises. All rights reserved.</div>
  </div>

<script>
  // ====== CHANGE YOUR LAUNCH DATE HERE ======
  const launch = new Date(2026, 6, 1, 0, 0, 0); // = 1 July 2026 (months start at 0: 6 = July)
  // ==========================================
  function tick() {
    let diff = Math.max(0, launch - new Date());
    const d = Math.floor(diff / 86400000);
    const h = Math.floor(diff / 3600000) % 24;
    const m = Math.floor(diff / 60000) % 60;
    const s = Math.floor(diff / 1000) % 60;
    document.getElementById('d').textContent = String(d).padStart(2,'0');
    document.getElementById('h').textContent = String(h).padStart(2,'0');
    document.getElementById('m').textContent = String(m).padStart(2,'0');
    document.getElementById('s').textContent = String(s).padStart(2,'0');
  }
  tick(); setInterval(tick, 1000);

  // build randomized animated candlesticks
  function buildCandles(el, n) {
    let html = "";
    for (let i = 0; i < n; i++) {
      const up = Math.random() > .45;
      const h = 12 + Math.random() * 78;
      const p = (0.55 + Math.random() * 0.8).toFixed(2);
      const delay = (Math.random() * 5).toFixed(2);
      html += '<div class="candle ' + (up ? "up" : "dn") + '"><i style="--h:' + h.toFixed(0) + '%;--p:' + p + ';animation-delay:-' + delay + 's"></i></div>';
    }
    el.innerHTML = html;
  }
  buildCandles(document.getElementById("candlesBack"), 44);
  buildCandles(document.getElementById("candlesFront"), 28);
</script>
</body>
</html>
